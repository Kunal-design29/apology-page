<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Really Sorry 💔</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to right, #FF6F61, #FFB88C);
            text-align: center;
            color: white;
            overflow: hidden;
        }
        h1 {
            font-size: 3em;
            margin-top: 50px;
            text-shadow: 3px 3px 7px black;
            animation: shake 1s infinite alternate;
        }
        @keyframes shake {
            0% { transform: translateX(-3px); }
            100% { transform: translateX(3px); }
        }
        .heart {
            font-size: 2em;
            animation: heartbeat 1.5s infinite;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        p {
            font-size: 1.5em;
            margin: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            cursor: pointer;
            background: #E74C3C;
            color: white;
            border-radius: 10px;
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
            transition: 0.3s ease;
        }
        button:hover {
            background: #C0392B;
            transform: scale(1.1);
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <h1>I'm Sorry 😢</h1>
    <p><span class="heart">💔</span> I never meant to hurt you.</p>
    <button onclick="sendLove()">Tap here</button>
    <p id="message" class="hidden">Here’s a small token of my love and regret ❤️</p>

    <script>
        function sendLove() {
            document.getElementById("message").classList.remove("hidden");
            alert("Sending my love and sincere apology to you! 💖");
        }
    </script>
</body>
</html>
